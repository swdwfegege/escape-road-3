  <!-- UNITY LOADER -->
  <script>
    var loadingText = document.querySelector("#loading-text");

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/escape-road-3-v26051406.loader.js";

    var config = {
      dataUrl:
        buildUrl + "/escape-road-3-v26051406.data.unityweb",

      frameworkUrl:
        buildUrl + "/escape-road-3-v26051406.framework.js.unityweb",

      codeUrl:
        buildUrl + "/escape-road-3-v26051406.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      companyName: "ozgames.io",

      productName: "Escape Road 3",

      productVersion: "26051406"
    };

    config.gameId = "escape-road-3";

    config.eventLog = false;


    var progressElement =
      document.getElementById("progress_fill");

    var container =
      document.getElementById("unity-container");

    var canvas =
      document.getElementById("unity-canvas");

    var loadingBar =
      document.getElementById("loadingBlock");

    var progressText =
      document.querySelector(".gameloader-progress-info");


    var script =
      document.createElement("script");

    script.src = loaderUrl;


    script.onload = function () {

      createUnityInstance(
        canvas,
        config,

        function (progress) {

          progressElement.style.width =
            100 * progress + "%";

          progressText.innerText =
            "Downloading file: " +
            Math.round(progress * 100) +
            "%";


          if (progress >= 0.99) {

            progressText.innerText =
              "Game Loading ...";

          }

        }

      )

      .then(function (unityInstance) {

        window.unityInstance =
          unityInstance;


        setTimeout(function () {

          loadingBar.style.display =
            "none";

          loadingText.remove();

          window.focus();

        }, 2000);


        container.style.display =
          "block";

      })


      .catch(function (message) {

        console.error(message);

        alert(
          "Unity failed to load:\n\n" +
          message
        );

      });

    };


    script.onerror = function () {

      alert(
        "Failed to load the Escape Road 3 Unity loader."
      );

    };


    document.body.appendChild(script);

  </script>
